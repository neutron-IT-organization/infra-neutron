kind: Deployment
apiVersion: apps/v1
metadata:
  name: db
  namespace: docmost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: db-pvc
      containers:
        - name: postgres
          image: 'postgres:16-alpine'
          env:
            - name: POSTGRES_DB
              value: docmost
            - name: POSTGRES_USER
              value: docmost
            - name: POSTGRES_PASSWORD
              value: G7gH2Xf5TqLp9YcBmNk4VzW8Rv3JX6Q
          resources: {}
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
      securityContext:
        runAsUser: 0
